<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GameList">
  <link rel="manifest" href="manifest.json">
  <title>Q's Gaming Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── CSS CUSTOM PROPERTIES PER THEME ──────────────────── */
    :root,[data-theme="void"]{
      --bg-from:#0f0c29;--bg-via:#302b63;--bg-to:#24243e;
      --card:#1e1b4b;--card-border:#312e81;--card-hover:#231e6b;
      --text:#e2e8f0;--subtext:#94a3b8;--muted:#64748b;
      --accent:#7c3aed;--accent2:#ec4899;--accent-text:#fff;
      --header-grad:linear-gradient(135deg,#667eea,#764ba2);
      --btn-neutral:#374151;--btn-neutral-t:#d1d5db;
      --overlay:rgba(15,12,41,0.82);
      --input-bg:#312e81;--input-border:#4338ca;--input-text:#e2e8f0;
      --scrollbar:#7c3aed;
    }
    [data-theme="cyber"]{
      --bg-from:#000000;--bg-via:#0d1117;--bg-to:#001100;
      --card:#0d1117;--card-border:#00ff4122;--card-hover:#0a1f0a;
      --text:#00ff41;--subtext:#00cc33;--muted:#009922;
      --accent:#00ff41;--accent2:#00ccff;--accent-text:#000;
      --header-grad:linear-gradient(135deg,#003300,#00ff41);
      --btn-neutral:#0a1f0a;--btn-neutral-t:#00ff41;
      --overlay:rgba(0,0,0,0.88);
      --input-bg:#0a1f0a;--input-border:#00ff4155;--input-text:#00ff41;
      --scrollbar:#00ff41;
    }
    [data-theme="arctic"]{
      --bg-from:#dbeafe;--bg-via:#ede9fe;--bg-to:#fce7f3;
      --card:#ffffff;--card-border:#e2e8f0;--card-hover:#f8fafc;
      --text:#1e293b;--subtext:#475569;--muted:#94a3b8;
      --accent:#3b82f6;--accent2:#8b5cf6;--accent-text:#fff;
      --header-grad:linear-gradient(135deg,#3b82f6,#8b5cf6);
      --btn-neutral:#f1f5f9;--btn-neutral-t:#475569;
      --overlay:rgba(219,234,254,0.75);
      --input-bg:#f8fafc;--input-border:#cbd5e1;--input-text:#1e293b;
      --scrollbar:#3b82f6;
    }
    [data-theme="ember"]{
      --bg-from:#1a0500;--bg-via:#2d0f00;--bg-to:#1a0000;
      --card:#1f0a05;--card-border:#7c2d0c;--card-hover:#2d0f05;
      --text:#fef3c7;--subtext:#fcd34d;--muted:#d97706;
      --accent:#dc2626;--accent2:#ea580c;--accent-text:#fff;
      --header-grad:linear-gradient(135deg,#dc2626,#ea580c);
      --btn-neutral:#2d0f05;--btn-neutral-t:#fcd34d;
      --overlay:rgba(26,5,0,0.85);
      --input-bg:#2d0f05;--input-border:#7c2d0c;--input-text:#fef3c7;
      --scrollbar:#dc2626;
    }
    [data-theme="slate"]{
      --bg-from:#020617;--bg-via:#0f172a;--bg-to:#020617;
      --card:#0f172a;--card-border:#1e293b;--card-hover:#1e293b;
      --text:#f1f5f9;--subtext:#94a3b8;--muted:#64748b;
      --accent:#0ea5e9;--accent2:#6366f1;--accent-text:#fff;
      --header-grad:linear-gradient(135deg,#0ea5e9,#6366f1);
      --btn-neutral:#1e293b;--btn-neutral-t:#94a3b8;
      --overlay:rgba(2,6,23,0.85);
      --input-bg:#1e293b;--input-border:#334155;--input-text:#f1f5f9;
      --scrollbar:#0ea5e9;
    }

    /* ── BASE ────────────────────────────────────────────── */
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html{scroll-behavior:smooth}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      overflow-x:hidden;background:var(--bg-from);color:var(--text);
      overscroll-behavior-y:contain;touch-action:pan-y;
    }
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:99px;opacity:.5}

    /* ── BG SLIDESHOW ────────────────────────────────────── */
    .bg-slide{
      position:fixed;inset:0;z-index:0;
      background-size:cover;background-position:center;
      transition:background-image 1.5s ease-in-out, opacity 1.5s ease-in-out;
      opacity:0;
    }
    .bg-slide.active{opacity:1}
    .bg-overlay{
      position:fixed;inset:0;z-index:1;
      background:var(--overlay);
      backdrop-filter:blur(2px);
    }
    #root{position:relative;z-index:2}

    /* ── LOADING ─────────────────────────────────────────── */
    .loading-screen{
      position:fixed;inset:0;z-index:99999;
      background:var(--header-grad);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      color:#fff;transition:opacity .6s;
    }
    .loading-screen.hide{opacity:0;pointer-events:none}
    .loader{
      width:52px;height:52px;
      border:4px solid rgba(255,255,255,.25);border-top-color:#fff;
      border-radius:50%;animation:spin .9s linear infinite;margin-bottom:20px;
    }
    .loading-screen h2{font-size:22px;font-weight:700;margin-bottom:6px}
    .loading-screen p{font-size:13px;opacity:.8}

    /* ── INSTALL PROMPT ──────────────────────────────────── */
    .install-prompt{
      position:fixed;bottom:20px;left:16px;right:16px;
      background:var(--header-grad);color:#fff;
      padding:16px;border-radius:16px;
      box-shadow:0 20px 40px rgba(0,0,0,.4);display:none;z-index:9999;
    }
    .install-prompt.show{display:block;animation:slideUp .3s ease}
    .install-content{display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .install-icon{font-size:30px}
    .install-text h3{font-size:15px;font-weight:700;margin-bottom:2px}
    .install-text p{font-size:12px;opacity:.85}
    .install-buttons{display:flex;gap:8px}
    .install-buttons button{flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px}
    #installBtn{background:#fff;color:#764ba2}
    #dismissBtn{background:rgba(255,255,255,.2);color:#fff}

    /* ── CARD BASE ───────────────────────────────────────── */
    .game-card{
      background:var(--card);border:1px solid var(--card-border);
      border-radius:14px;overflow:hidden;
      transition:transform .15s,box-shadow .15s,background .2s;
    }
    .game-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}

    /* ── VIEW MODES ──────────────────────────────────────── */
    .view-list .game-list{display:flex;flex-direction:column;gap:8px}
    .view-grid .game-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .view-tiles .game-list{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    @media(min-width:640px){
      .view-tiles .game-list{grid-template-columns:repeat(4,1fr)}
    }
    @media(min-width:1024px){
      .view-grid .game-list{grid-template-columns:repeat(2,1fr)}
      .view-tiles .game-list{grid-template-columns:repeat(3,1fr)}
    }

    /* ── TILE CARD specific ──────────────────────────────── */
    .tile-cover{
      width:100%;aspect-ratio:2/3;
      object-fit:cover;display:block;
    }
    .tile-cover-fallback{
      width:100%;aspect-ratio:2/3;
      display:flex;align-items:center;justify-content:center;font-size:2.5rem;
      background:var(--card-border);
    }

    /* ── UI COMPONENTS ───────────────────────────────────── */
    .btn-accent{
      background:var(--accent);color:var(--accent-text);
      border:none;border-radius:10px;padding:10px 16px;
      font-weight:700;cursor:pointer;font-size:13px;
      transition:opacity .15s,transform .1s;display:inline-flex;align-items:center;gap:6px;
    }
    .btn-accent:hover{opacity:.9;transform:translateY(-1px)}
    .btn-accent2{background:var(--accent2);color:#fff}
    .card-base{
      background:var(--card);border:1px solid var(--card-border);
      border-radius:14px;
    }
    .input-base{
      background:var(--input-bg);border:1px solid var(--input-border);
      color:var(--input-text);border-radius:8px;padding:8px 12px;
      font-size:13px;width:100%;outline:none;
      transition:border-color .15s;
    }
    .input-base:focus{border-color:var(--accent)}
    .tag{
      display:inline-flex;align-items:center;
      padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;
    }

    /* ── STATUS BUTTONS ──────────────────────────────────── */
    .status-row{display:flex;gap:4px;padding:0 10px 10px}
    .status-btn{
      flex:1;padding:4px 2px;border:none;border-radius:6px;
      font-size:10px;font-weight:700;cursor:pointer;
      transition:all .15s;color:#fff;opacity:.35;
    }
    .status-btn.active{opacity:1;transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .status-btn:hover:not(.active){opacity:.65}
    .s-notdl{background:#6b7280}
    .s-downloaded{background:#3b82f6}
    .s-playing{background:#22c55e}
    .s-completed{background:#a855f7}
    .s-favorite{background:#eab308}

    /* ── SIDEBAR ─────────────────────────────────────────── */
    .sidebar-panel{
      background:var(--card);border:1px solid var(--card-border);
      border-radius:14px;overflow:hidden;
    }
    .sidebar-tabs{display:flex;gap:4px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--card-border)}
    .sidebar-tab{
      padding:5px 10px;border-radius:8px;font-size:11px;font-weight:600;
      white-space:nowrap;cursor:pointer;border:none;
      background:var(--btn-neutral);color:var(--btn-neutral-t);
      transition:all .15s;
    }
    .sidebar-tab.active{background:var(--accent);color:var(--accent-text)}
    .sidebar-item{
      display:flex;gap:10px;padding:10px 12px;
      border-bottom:1px solid var(--card-border);
      transition:background .15s;text-decoration:none;
    }
    .sidebar-item:hover{background:var(--card-hover)}
    .sidebar-item:last-child{border-bottom:none}
    .sidebar-thumb{
      width:44px;height:58px;object-fit:cover;
      border-radius:6px;flex-shrink:0;background:var(--card-border);
    }
    .sidebar-thumb-sq{
      width:44px;height:44px;object-fit:cover;
      border-radius:6px;flex-shrink:0;background:var(--card-border);
    }
    .yt-thumb{width:80px;height:45px;object-fit:cover;border-radius:6px;flex-shrink:0}
    .sidebar-meta{font-size:11px;color:var(--subtext);margin-top:2px}
    .sidebar-title{font-size:12px;font-weight:600;color:var(--text);line-height:1.3}
    .badge-new{
      display:inline-block;background:var(--accent2);color:#fff;
      padding:1px 6px;border-radius:99px;font-size:9px;font-weight:700;
      margin-left:4px;vertical-align:middle;
    }

    /* ── THEME SWITCHER ──────────────────────────────────── */
    .theme-swatch{
      width:22px;height:22px;border-radius:50%;border:2px solid transparent;
      cursor:pointer;transition:all .15s;flex-shrink:0;
    }
    .theme-swatch.active{border-color:#fff;transform:scale(1.2)}

    /* ── NOTIFICATION DOT ────────────────────────────────── */
    .notif-dot{
      width:8px;height:8px;background:var(--accent2);
      border-radius:50%;display:inline-block;margin-left:4px;
      animation:pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .fade-in{animation:fadeIn .2s ease both}
    .animate-pulse{animation:pulse 1.5s ease-in-out infinite}

    /* ── STICKY SIDEBAR ──────────────────────────────────── */
    @media(min-width:1024px){
      .sidebar-sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
    }
    .sidebar-scroll-inner{overflow-y:auto;max-height:520px}

    /* ── PROGRESS BAR ────────────────────────────────────── */
    .progress-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
    .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .6s ease}

    /* ── NOTIFICATION BANNER ─────────────────────────────── */
    .notif-banner{
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:10px;margin-bottom:6px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;font-size:12px;font-weight:600;text-decoration:none;
      transition:opacity .15s;
    }
    .notif-banner:hover{opacity:.9}
  </style>
</head>

// ── STORAGE ────────────────────────────────────────────────────────
function ls(k,fb){try{var v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch(e){return fb;}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadGames(){
  var s=ls(CFG.STORE_KEY,null);
  if(!s)return GAMES_DEFAULT.map(function(g){return Object.assign({status:'not_downloaded',rating:0,notes:''},g);});
  var merged=GAMES_DEFAULT.map(function(g){
    var sv=(s||[]).find(function(x){return x.id===g.id;});
    return sv?Object.assign({},g,{status:sv.status||'not_downloaded',rating:sv.rating||0,notes:sv.notes||''}):Object.assign({status:'not_downloaded',rating:0,notes:''},g);
  });
  var custom=(s||[]).filter(function(x){return !GAMES_DEFAULT.find(function(g){return g.id===x.id;});});
  return merged.concat(custom);
}

var h=React.createElement, useState=React.useState, useEffect=React.useEffect, useRef=React.useRef;

function Ico(p){
  var s=p.size||18;
  return h('span',{className:'inline-flex items-center justify-center flex-shrink-0 '+(p.cls||p.className||''),
    style:{width:s,height:s},
    dangerouslySetInnerHTML:{__html:(SVG[p.n]||SVG.circle).replace('viewBox','width="'+s+'" height="'+s+'" viewBox')}
  });
}

// ── BACKGROUND SLIDESHOW ───────────────────────────────────────────
var bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB');
var _bgImages=[], _bgIdx=0, _bgActive='a';
function initBg(imgs){
  _bgImages=imgs.filter(Boolean);
  if(_bgImages.length===0)return;
  bgA.style.backgroundImage='url('+_bgImages[0]+')';
  bgA.classList.add('active');
}
function nextBg(){
  if(_bgImages.length<2)return;
  _bgIdx=(_bgIdx+1)%_bgImages.length;
  if(_bgActive==='a'){
    bgB.style.backgroundImage='url('+_bgImages[_bgIdx]+')';
    bgB.classList.add('active');
    setTimeout(function(){bgA.classList.remove('active');},1500);
    _bgActive='b';
  } else {
    bgA.style.backgroundImage='url('+_bgImages[_bgIdx]+')';
    bgA.classList.add('active');
    setTimeout(function(){bgB.classList.remove('active');},1500);
    _bgActive='a';
  }
}
function clearBg(){bgA.classList.remove('active');bgB.classList.remove('active');}

      return h('button',{key:i,
        onClick:function(e){e.stopPropagation();if(p.onChange)p.onChange(i);},
        className:'focus:outline-none '+(p.onChange?'hover:scale-110 transition-transform':'cursor-default')},
        h(Ico,{n:i<=(p.rating||0)?'starFill':'star',size:p.size||14,cls:i<=(p.rating||0)?'text-yellow-400':'text-gray-500'})

  );
}

// ── ADD GAME FORM ──────────────────────────────────────────────────
function AddForm(p){
  var fs=useState({name:'',genre:'',fps:'',tier:'C',trailer:'',desc:'',hours:'',icon:'🎮',image:''});
  var f=fs[0]; var sf=fs[1];
  var ss=useState(false); var searching=ss[0]; var setSearching=ss[1];
  var rs=useState([]); var results=rs[0]; var setResults=rs[1];
  function set(k,v){sf(function(prev){var n=Object.assign({},prev);n[k]=v;return n;});}

  function doSearch(){
    if(!f.name||f.name.length<2)return;
    setSearching(true);setResults([]);
    rawg('games?search='+encodeURIComponent(f.name)+'&page_size=6')
      .then(function(d){
        var list=(d.results||[]).map(function(g){return{id:g.id,name:g.name,released:g.released,rating:g.rating,image:g.background_image,genres:(g.genres||[]).map(function(x){return x.name;}).join(', ')};});
        setResults(list.length?list:[{id:'nr',name:'No results found.',noResult:true}]);
        setSearching(false);
      }).catch(function(e){alert('Search failed: '+(e.message||'unknown'));setSearching(false);});
  }

  function selectGame(id){
    setSearching(true);setResults([]);
    rawg('games/'+id)
      .then(function(g){
        var age=new Date().getFullYear()-(g.released?parseInt(g.released):2020);
        var fps=age<=2?'20-30':age<=5?'30-45':age<=8?'40-55':'50-60';
        var sc=g.metacritic||(g.rating||0)*20;
        var tier=sc>=90?'S':sc>=80?'A':sc>=70?'B':'C';
        var em={Action:'⚔️',Adventure:'🗺️',RPG:'🎭',Shooter:'🔫',Racing:'🏎️',Sports:'⚽',Horror:'👻',Indie:'🎨'};
        var gn=(g.genres||[{name:''}])[0].name;
        sf({name:g.name,genre:(g.genres||[]).map(function(x){return x.name;}).join(', ')||'Unknown',fps:fps,tier:tier,
          trailer:'https://www.youtube.com/results?search_query='+encodeURIComponent(g.name)+'+official+trailer',
          desc:g.description_raw?g.description_raw.substring(0,200)+'...':'',
          hours:g.playtime?g.playtime+'-'+(g.playtime+5):'',icon:em[gn]||'🎮',image:g.background_image||''});
        setSearching(false);
      }).catch(function(e){alert('Failed: '+(e.message||'unknown'));setSearching(false);});
  }

  function submit(e){
    e.preventDefault();
    if(!f.name.trim()){alert('Game name is required!');return;}
    p.onAdd(Object.assign({},f,{id:Date.now(),status:'not_downloaded',rating:0,notes:''}));
    p.onClose();
  }

  return h('div',{className:'card-base p-4 mb-4'},
    h('div',{className:'flex justify-between items-center mb-4'},
      h('h3',{className:'font-bold text-base',style:{color:'var(--text)'}},'➕ Add New Game'),
      h('button',{onClick:p.onClose,style:{color:'var(--muted)',fontSize:20,background:'none',border:'none',cursor:'pointer'}},'✕')
    ),
    h('div',{className:'rounded-xl p-3 mb-3',style:{background:'var(--accent)22',border:'1px solid var(--accent)44'}},
      h('p',{className:'text-xs font-semibold mb-2',style:{color:'var(--accent)'}},'🔍 Search RAWG Game Database'),
      h('div',{className:'flex gap-2'},
        h('input',{type:'text',placeholder:'Type game name...',value:f.name,disabled:searching,
          className:'input-base flex-1',
          onChange:function(e){set('name',e.target.value);},
          onKeyDown:function(e){if(e.key==='Enter'){e.preventDefault();doSearch();}}}),
        h('button',{type:'button',onClick:doSearch,disabled:searching||!f.name,
          className:'btn-accent',style:{opacity:searching||!f.name?.5:1}},
          searching?'⏳':'🔍')
      )
    ),
    results.length>0&&h('div',{className:'rounded-xl border p-2 mb-3 max-h-52 overflow-y-auto',style:{borderColor:'var(--card-border)',background:'var(--card)'}},
      results.map(function(g){
        if(g.noResult)return h('p',{key:'nr',className:'text-center text-xs py-3',style:{color:'var(--muted)'}},g.name);
        return h('button',{key:g.id,type:'button',onClick:function(){selectGame(g.id);},
          className:'w-full text-left p-2 rounded-lg mb-1 flex items-center gap-2',
          style:{background:'var(--card-hover)'}},
          g.image&&h('img',{src:g.image,alt:'',className:'w-9 h-12 object-cover rounded flex-shrink-0',onError:function(e){e.target.style.display='none';}}),
          h('div',{className:'flex-1 min-w-0'},
            h('p',{className:'text-xs font-semibold truncate',style:{color:'var(--text)'}},g.name),

    if(!bgOn)return;
    var imgs=games.map(function(g){return imgCache[g.id]||g.image||'';}).filter(Boolean);
    if(imgs.length>0){initBg(imgs);}

    if(!missing.length)return;
    var i=0;
    function next(){

      rawg('games?search='+encodeURIComponent(g.name)+'&page_size=1&exact=true')
        .then(function(d){
          var r=(d.results||[])[0];
          if(r&&r.background_image){

          }

    return true;

    if(sort==='rating')return(b.rating||0)-(a.rating||0);

    return a.name.localeCompare(b.name);

  function delGame(id){setGames(function(gs){return gs.filter(function(g){return g.id!==id;});});setExpId(null);}

            }})
          )
        ),

        // ADD GAME
        showAdd
          ?h(AddForm,{onAdd:addGame,onClose:function(){setShowAdd(false);}})
          :h('button',{onClick:function(){setShowAdd(true);},
              className:'btn-accent w-full justify-center',style:{background:'linear-gradient(135deg,var(--accent),var(--accent2))',padding:'12px 0',fontSize:14,borderRadius:14,boxShadow:'0 4px 20px rgba(0,0,0,.25)'}},
              h(Ico,{n:'plus',size:17,cls:'text-white'}),' Add New Game'),

        // GAME LIST/GRID/TILES
        h('div',{className:'game-list'},
          shown.length>0
            ?shown.map(function(g){
                var cp=cardProps(g);
                if(view==='grid')return h(GridCard,cp);
                if(view==='tiles')return h(TileCard,cp);
                return h(GameCard,cp);
              })
            :[h('div',{key:'empty',className:'card-base p-10 text-center'},
                h('div',{className:'text-5xl mb-3'},'🎮'),
                h('p',{className:'font-semibold text-sm',style:{color:'var(--subtext)'}},q?'No games match "'+q+'"':filter!=='all'?'No games here':'Add your first game!')
              )]
        ),

        // FOOTER
        h('p',{className:'text-center text-xs pb-4',style:{color:'var(--muted)'}},
          'Made with ❤️ for '+CFG.APP_AUTHOR+"'s Gaming Journey • v"+CFG.APP_VERSION)
      ),

      // ── SIDEBAR COLUMN ───────────────────────────────────────────
      h('div',{className:'hidden lg:block w-72 flex-shrink-0 sidebar-sticky'},h(Sidebar,null)),
      h('div',{className:'lg:hidden mt-4'},h(Sidebar,null))
    )
  );
}

ReactDOM.render(h(App,null),document.getElementById('root'));

// PWA
(function(){
  var d=null;
  if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();d=e;
    var dis=localStorage.getItem('installDis');
    if(!dis||(Date.now()-parseInt(dis))/86400000>7)setTimeout(function(){var el=document.getElementById('installPrompt');if(el)el.classList.add('show');},5000);
  });
  document.addEventListener('click',function(e){
    if(e.target.id==='installBtn'&&d){d.prompt();d=null;var el=document.getElementById('installPrompt');if(el)el.classList.remove('show');}
    if(e.target.id==='dismissBtn'){var el=document.getElementById('installPrompt');if(el)el.classList.remove('show');localStorage.setItem('installDis',Date.now()+'');}
  });
})();
</script>
</body>
</html>
