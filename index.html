/*
  ============================================
  GAMING CHECKLIST - STYLES
  ============================================
  
  This file contains ALL visual styling.
  
  SECTIONS:
  1. Base Styles (resets, fonts)
  2. Loading Screen
  3. Install Prompt
  4. Animations
  5. Utility Classes
  
  ============================================
*/

/* ==================== 1. BASE STYLES ==================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 
               Oxygen, Ubuntu, Cantarell, sans-serif;
  overflow-x: hidden;
  touch-action: pan-y;
  background: #1e1b4b;
}

/* Prevent pull-to-refresh on mobile */
body {
  overscroll-behavior-y: contain;
}


/* ==================== 2. LOADING SCREEN ==================== */

.loading-screen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  color: white;
}

.loading-screen.hide {
  animation: fadeOut 0.5s forwards;
}

.loading-screen h2 {
  font-size: 24px;
  margin-bottom: 8px;
  font-weight: bold;
}

.loading-screen p {
  font-size: 14px;
  opacity: 0.9;
}

.loader {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255,255,255,0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}


/* ==================== 3. INSTALL PROMPT ==================== */

.install-prompt {
  position: fixed;
  bottom: 20px;
  left: 20px;
  right: 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  display: none;
  z-index: 9999;
  animation: slideUp 0.3s ease;
}

.install-prompt.show {
  display: block;
}

.install-content {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.install-icon {
  font-size: 32px;
}

.install-text h3 {
  font-size: 16px;
  margin-bottom: 4px;
  font-weight: bold;
}

.install-text p {
  font-size: 13px;
  opacity: 0.9;
}

.install-buttons {
  display: flex;
  gap: 8px;
}

.install-buttons button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
  font-size: 14px;
}

#installBtn {
  background: white;
  color: #764ba2;
}

#dismissBtn {
  background: rgba(255,255,255,0.2);
  color: white;
}


/* ==================== 4. ANIMATIONS ==================== */

@keyframes spin {
  to { 
    transform: rotate(360deg); 
  }
}

@keyframes fadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

@keyframes slideUp {
  from {
    transform: translateY(100px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes scaleIn {
  from {
    transform: scale(0.9);
    opacity: 0;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}


/* ==================== 5. UTILITY CLASSES ==================== */

.fade-in {
  animation: fadeIn 0.3s ease;
}

.scale-in {
  animation: scaleIn 0.3s ease;
}

/* Smooth transitions */
.smooth-transition {
  transition: all 0.3s ease;
}

/* Active state for touch devices */
.touchable:active {
  opacity: 0.7;
  transform: scale(0.98);
}

/* No select (prevent text selection on buttons) */
.no-select {
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}

/* Scrollbar styling (for webkit browsers) */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: rgba(0,0,0,0.1);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb {
  background: rgba(124, 58, 237, 0.5);
  border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(124, 58, 237, 0.7);
}


/* ==================== RESPONSIVE DESIGN ==================== */

/* Mobile-first approach (default styles are for mobile) */

/* Tablet (768px and up) */
@media (min-width: 768px) {
  .install-prompt {
    max-width: 400px;
    left: 50%;
    transform: translateX(-50%);
  }
}

/* Desktop (1024px and up) */
@media (min-width: 1024px) {
  body {
    overflow-y: scroll; /* Always show scrollbar to prevent jump */
  }
}


/* ==================== DARK MODE OVERRIDES ==================== */

/*
  ============================================
  STORAGE MANAGER
  ============================================
  
  This file handles ALL data saving and loading.
  Uses localStorage (browser's built-in storage).
  
  WHAT IT DOES:
  - Saves games to browser
  - Loads games from browser
  - Exports data to file
  - Imports data from file
  - Manages user settings
  
  ============================================
*/

const StorageManager = {
  
  // ==================== SAVE GAMES ====================
  saveGames: function(games) {
    try {
      const json = JSON.stringify(games);
      localStorage.setItem(APP_CONFIG.STORAGE.GAMES_KEY, json);
      console.log('✅ Games saved successfully');
      return true;
    } catch (error) {
      console.error('❌ Error saving games:', error);
      alert('Failed to save games. Storage might be full.');
      return false;
    }
  },
  
  
  // ==================== LOAD GAMES ====================
  loadGames: function() {
    try {
      const saved = localStorage.getItem(APP_CONFIG.STORAGE.GAMES_KEY);
      
      if (!saved) {
        console.log('📝 No saved games found, using initial data');
        return window.GAME_DATA.map(game => ({
          ...game,
          status: game.status || APP_CONFIG.STATUS.NOT_DOWNLOADED
        }));
      }
      
      const savedGames = JSON.parse(saved);
      const initialGames = window.GAME_DATA;
      
      // Merge saved data with initial data
      const merged = initialGames.map(game => {
        const savedGame = savedGames.find(sg => sg.id === game.id);
        return savedGame 
          ? { ...game, status: savedGame.status, rating: savedGame.rating, notes: savedGame.notes }
          : { ...game, status: game.status || APP_CONFIG.STATUS.NOT_DOWNLOADED };
      });
      
      // Add any custom games that aren't in initial data
      const customGames = savedGames.filter(sg => !initialGames.find(ig => ig.id === sg.id));
      
      console.log('✅ Games loaded successfully');
      return [...merged, ...customGames];
      
    } catch (error) {
      console.error('❌ Error loading games:', error);
      alert('Failed to load saved games. Using default data.');
      return window.GAME_DATA.map(game => ({
        ...game,
        status: game.status || APP_CONFIG.STATUS.NOT_DOWNLOADED
      }));
    }
  },
  
  
  // ==================== SAVE DARK MODE ====================
  saveDarkMode: function(isDark) {
    try {
      localStorage.setItem(APP_CONFIG.STORAGE.DARK_MODE_KEY, JSON.stringify(isDark));
      console.log('✅ Dark mode preference saved:', isDark);
      return true;
    } catch (error) {
      console.error('❌ Error saving dark mode:', error);
      return false;
    }
  },
  
  
  // ==================== LOAD DARK MODE ====================
  loadDarkMode: function() {
    try {
      const saved = localStorage.getItem(APP_CONFIG.STORAGE.DARK_MODE_KEY);
      return saved ? JSON.parse(saved) : APP_CONFIG.DEFAULTS.DARK_MODE;
    } catch (error) {
      console.error('❌ Error loading dark mode:', error);
      return APP_CONFIG.DEFAULTS.DARK_MODE;
    }
  },
  
  
  // ==================== EXPORT TO FILE ====================
  exportToFile: function(games) {
    try {
      const dataStr = JSON.stringify(games, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      
      const link = document.createElement('a');
      link.href = url;
      link.download = `gaming-checklist-backup-${Date.now()}.json`;
      link.click();
      
      // Cleanup
      setTimeout(() => URL.revokeObjectURL(url), 100);
      
      console.log('✅ Data exported successfully');
      return true;
    } catch (error) {
      console.error('❌ Error exporting data:', error);
      alert('Failed to export data.');
      return false;
    }
  },
  
  
  // ==================== IMPORT FROM FILE ====================
  importFromFile: function(file, callback) {
    if (!file) {
      console.error('❌ No file provided');
      return;
    }
    
    // Check file type
    if (!file.name.endsWith('.json')) {
      alert('Please select a valid JSON file');
      return;
    }
    
    // Check file size
    if (file.size > APP_CONFIG.VALIDATION.MAX_IMPORT_SIZE) {
      alert('File is too large. Maximum size is 5MB.');
      return;
    }
    
    const reader = new FileReader();
    
    reader.onload = function(event) {
      try {
        const imported = JSON.parse(event.target.result);
        
        // Validate data
        if (!Array.isArray(imported)) {
          throw new Error('Invalid data format');
        }
        
        console.log('✅ Data imported successfully:', imported.length, 'games');
        callback(imported);
        
      } catch (error) {
        console.error('❌ Error importing data:', error);
        alert('Invalid file format. Please select a valid backup file.');
      }
    };
    
    reader.onerror = function() {
      console.error('❌ Error reading file');
      alert('Failed to read file.');
    };
    
    reader.readAsText(file);
  },
  
  
  // ==================== CLEAR ALL DATA ====================
  clearAllData: function() {
    if (!confirm('⚠️ This will delete ALL your data. Are you sure?')) {
      return false;
    }
    
    if (!confirm('⚠️ Last chance! This cannot be undone. Continue?')) {
      return false;
    }
    
    try {
      localStorage.removeItem(APP_CONFIG.STORAGE.GAMES_KEY);
      localStorage.removeItem(APP_CONFIG.STORAGE.DARK_MODE_KEY);
      localStorage.removeItem(APP_CONFIG.STORAGE.INSTALL_DISMISSED_KEY);
      localStorage.removeItem(APP_CONFIG.STORAGE.USER_SETTINGS_KEY);
      
      console.log('✅ All data cleared');
      alert('All data has been cleared. The page will reload.');
      window.location.reload();
      return true;
    } catch (error) {
      console.error('❌ Error clearing data:', error);
      alert('Failed to clear data.');
      return false;
    }
  },
  
  
  // ==================== GET STORAGE INFO ====================
  getStorageInfo: function() {
    try {
      // Estimate storage usage
      let totalSize = 0;
      for (let key in localStorage) {
        if (localStorage.hasOwnProperty(key)) {
          totalSize += localStorage[key].length + key.length;
        }
      }
      
      // Convert to KB
      const sizeKB = (totalSize / 1024).toFixed(2);
      
      return {
        itemCount: localStorage.length,
        sizeKB: sizeKB,
        sizeMB: (sizeKB / 1024).toFixed(2),
        keys: Object.keys(localStorage)
      };
    } catch (error) {
      console.error('❌ Error getting storage info:', error);
      return null;
    }
  },
  
  
  // ==================== CHECK IF STORAGE AVAILABLE ====================
  isStorageAvailable: function() {
    try {
      const test = '__storage_test__';
      localStorage.setItem(test, test);
      localStorage.removeItem(test);
      return true;
    } catch (error) {
      console.warn('⚠️ localStorage not available:', error);
      return false;
    }
  },
  
};

// Make StorageManager available globally
window.StorageManager = StorageManager;

// Check if storage is available on load
if (!StorageManager.isStorageAvailable()) {
  alert('⚠️ Warning: Browser storage is not available. Your data will not be saved!');
}

// ==================== MAIN GAME CARD COMPONENT ====================
const GameCard = ({ 
  game, 
  darkMode, 
  isExpanded, 
  onToggleExpand,
  onUpdateStatus,
  onUpdateRating,
  onUpdateNotes,
  onDelete
}) => {
  
  const [isEditingNotes, setIsEditingNotes] = useState(false);
  const [tempNotes, setTempNotes] = useState(game.notes || '');
  
  // Get background color based on status
  const getBg = (status) => {
    if (darkMode) {
      const bgs = {
        not_downloaded: 'bg-gray-800',
        downloaded: 'bg-blue-900',
        playing: 'bg-green-900',
        completed: 'bg-purple-900',
        favorite: 'bg-yellow-900'
      };
      return bgs[status] || 'bg-gray-800';
    }
    const bgs = {
      not_downloaded: 'bg-white',
      downloaded: 'bg-blue-50',
      playing: 'bg-green-50',
      completed: 'bg-purple-50',
      favorite: 'bg-yellow-50'
    };
    return bgs[status] || 'bg-white';
  };
  
  // Get status icon
  const getStatusIcon = (status) => {
    const iconMap = {
      not_downloaded: { name: 'circle', className: 'text-gray-400' },
      downloaded: { name: 'download', className: 'text-blue-500' },
      playing: { name: 'play', className: 'text-green-500' },
      completed: { name: 'check', className: 'text-purple-500' },
      favorite: { name: 'star', className: 'text-yellow-500', fill: 'currentColor' }
    };
    const icon = iconMap[status] || iconMap.not_downloaded;
    return <Icon name={icon.name} size={20} className={icon.className} fill={icon.fill} />;
  };
  
  // Get tier badge
  const getTierBadge = (tier) => {
    const tierInfo = APP_CONFIG.TIERS[tier];
    if (!tierInfo) return null;
    
    return (
      <span className={`px-2 py-1 rounded text-xs font-bold ${tierInfo.color} text-white`}>
        {tierInfo.label}
      </span>
    );
  };
  
  // Handle save notes
  const handleSaveNotes = () => {
    onUpdateNotes(game.id, tempNotes);
    setIsEditingNotes(false);
  };
  
  // Handle cancel notes
  const handleCancelNotes = () => {
    setTempNotes(game.notes || '');
    setIsEditingNotes(false);
  };
  
  return (
    <div className={`${getBg(game.status)} rounded-xl shadow-lg overflow-hidden transition-all`}>
      
      {/* ========== COLLAPSED VIEW ========== */}
      <div
        onClick={onToggleExpand}
        className="p-4 cursor-pointer active:opacity-80 transition-opacity"
      >
        <div className="flex items-start justify-between gap-3">
          
          {/* Left side: Icon + Info */}
          <div className="flex items-start gap-3 flex-1 min-w-0">
            {/* Game Icon */}
            <div className="text-3xl flex-shrink-0">
              {game.icon || '🎮'}
            </div>
            
            {/* Game Info */}
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1 flex-wrap">
                <h3 className={`font-bold ${darkMode ? 'text-white' : 'text-gray-800'}`}>

                {getTierBadge(game.tier)}
              </div>
              
              <div className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-600'} space-y-1`}>
                <div>📂 {game.genre} • ⚡ {game.fps} FPS</div>
                {game.hours && <div>⏱️ {game.hours} hours</div>}

                  <div className="flex gap-1">
                    {[1,2,3,4,5].map(i => (
                      <Icon 
                        key={i} 
                        name="star" 
                        size={12} 
                        fill={i <= game.rating ? 'currentColor' : 'none'} 
                        className={i <= game.rating ? 'text-yellow-500' : 'text-gray-400'} 
                      />
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
          
          {/* Right side: Status + Expand */}
          <div className="flex flex-col items-center gap-2">
            <div onClick={(e) => { e.stopPropagation(); onUpdateStatus(game.id); }}>
              {getStatusIcon(game.status)}
            </div>
            <Icon name={isExpanded ? 'chevronUp' : 'chevronDown'} size={16} />
          </div>
        </div>
      </div>
      
      {/* ========== EXPANDED VIEW ========== */}
      {isExpanded && (
        <div className={`px-4 pb-4 space-y-3 border-t ${darkMode ? 'border-gray-700' : 'border-gray-200'} pt-3`}>
          
          {/* Description */}
          {game.desc && (

            </p>
          )}

              <div className="flex gap-1">
                {[1,2,3,4,5].map(i => (
                  <button
                    key={i}

                    }}

                    <Icon

                    rows="3"

                  <div className="text-xs text-right opacity-60">

                  <div className="flex gap-2">

          {/* Action Links */}
          {APP_CONFIG.FEATURES.ENABLE_ONLINE_FEATURES && (
            <div className="space-y-2">
              {/* Trailer Button */}
              {APP_CONFIG.FEATURES.ENABLE_TRAILERS && game.trailer && (
                <a
                  href={game.trailer}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="flex items-center justify-center gap-2 bg-red-500 text-white p-3 rounded-lg font-bold hover:bg-red-600 transition-colors"
                  onClick={(e) => e.stopPropagation()}

              {APP_CONFIG.FEATURES.ENABLE_GAMERANX && (
                <a

      )}
    </div>
  );
};

/*
  ============================================
  FEATURES & LOGIC
  ============================================
  
  This file contains the main app features:
  - Search functionality
  - Filter functionality
  - Sort functionality
  - Add new game
  - Statistics calculation
  
  ============================================
*/

// ==================== SEARCH FUNCTION ====================
const searchGames = (games, searchTerm) => {
  if (!searchTerm || !APP_CONFIG.FEATURES.ENABLE_SEARCH) {
    return games;
  }
  
  const term = searchTerm.toLowerCase().trim();
  
  return games.filter(game => {
    const nameMatch = game.name.toLowerCase().includes(term);
    const genreMatch = game.genre.toLowerCase().includes(term);
    const descMatch = game.desc && game.desc.toLowerCase().includes(term);
    
    return nameMatch || genreMatch || descMatch;
  });
};


// ==================== FILTER FUNCTION ====================
const filterGames = (games, filter) => {
  if (!APP_CONFIG.FEATURES.ENABLE_FILTERS || filter === 'all') {
    return games;
  }
  
  return games.filter(game => game.status === filter);
};


// ==================== SORT FUNCTION ====================
const sortGames = (games, sortBy) => {
  if (!APP_CONFIG.FEATURES.ENABLE_SORTING) {
    return games;
  }
  
  const sorted = [...games];
  
  switch(sortBy) {
    case 'name':
      sorted.sort((a, b) => a.name.localeCompare(b.name));
      break;
      
    case 'fps':
      sorted.sort((a, b) => {
        // Extract max FPS from "30-60" format
        const aFps = parseInt(a.fps.split('-')[1] || a.fps.split('-')[0] || 0);
        const bFps = parseInt(b.fps.split('-')[1] || b.fps.split('-')[0] || 0);
        return bFps - aFps; // Descending order
      });
      break;
      
    case 'rating':
      sorted.sort((a, b) => (b.rating || 0) - (a.rating || 0));
      break;
      
    case 'tier':
    default:
      const tierOrder = { 'S': 0, 'A': 1, 'B': 2, 'C': 3, 'R': 4 };
      sorted.sort((a, b) => {
        if (tierOrder[a.tier] !== tierOrder[b.tier]) {
          return tierOrder[a.tier] - tierOrder[b.tier];
        }
        return a.name.localeCompare(b.name);
      });
      break;
  }
  
  return sorted;
};


// ==================== CALCULATE STATISTICS ====================
const calculateStats = (games) => {
  const total = games.length;
  const not_downloaded = games.filter(g => g.status === APP_CONFIG.STATUS.NOT_DOWNLOADED).length;
  const downloaded = games.filter(g => g.status === APP_CONFIG.STATUS.DOWNLOADED).length;
  const playing = games.filter(g => g.status === APP_CONFIG.STATUS.PLAYING).length;
  const completed = games.filter(g => g.status === APP_CONFIG.STATUS.COMPLETED).length;
  const favorite = games.filter(g => g.status === APP_CONFIG.STATUS.FAVORITE).length;
  
  const completedCount = completed + favorite;
  const completionPercent = total > 0 ? Math.round((completedCount / total) * 100) : 0;
  
  return {
    total,
    not_downloaded,
    downloaded,
    playing,
    completed,
    favorite,
    completionPercent
  };
};


// ==================== UPDATE GAME STATUS ====================
const updateGameStatus = (games, gameId) => {
  return games.map(game => {
    if (game.id === gameId) {
      const currentIndex = APP_CONFIG.STATUS_CYCLE.indexOf(game.status);
      const nextIndex = (currentIndex + 1) % APP_CONFIG.STATUS_CYCLE.length;
      const nextStatus = APP_CONFIG.STATUS_CYCLE[nextIndex];
      
      return { ...game, status: nextStatus };
    }
    return game;
  });
};


// ==================== UPDATE GAME RATING ====================
const updateGameRating = (games, gameId, rating) => {
  if (!APP_CONFIG.FEATURES.ENABLE_RATINGS) {
    return games;
  }
  
  return games.map(game => 
    game.id === gameId ? { ...game, rating } : game
  );
};


// ==================== UPDATE GAME NOTES ====================
const updateGameNotes = (games, gameId, notes) => {
  if (!APP_CONFIG.FEATURES.ENABLE_NOTES) {
    return games;
  }
  
  // Validate notes length
  const trimmedNotes = notes.trim();
  if (trimmedNotes.length > APP_CONFIG.VALIDATION.MAX_NOTES_LENGTH) {
    alert(`Notes too long! Maximum ${APP_CONFIG.VALIDATION.MAX_NOTES_LENGTH} characters.`);
    return games;
  }
  
  return games.map(game => 
    game.id === gameId ? { ...game, notes: trimmedNotes } : game
  );
};


// ==================== DELETE GAME ====================
const deleteGame = (games, gameId) => {
  if (!APP_CONFIG.FEATURES.ENABLE_DELETE_GAME) {
    return games;
  }
  
  // Don't allow deleting default games (id < 1000)
  const game = games.find(g => g.id === gameId);
  if (game && game.id < 1000) {
    alert('Cannot delete default games!');
    return games;
  }
  
  if (!window.confirm(`Delete "${game.name}"? This cannot be undone.`)) {
    return games;
  }
  
  return games.filter(g => g.id !== gameId);
};


// ==================== ADD NEW GAME ====================
const addNewGame = (games, newGameData) => {
  if (!APP_CONFIG.FEATURES.ENABLE_ADD_GAME) {
    console.error('Add game feature is disabled');
    return games;
  }

// ==================== VALIDATE GAME DATA ====================
const validateGameData = (gameData) => {
  const errors = [];
  
  // Check name
  if (!gameData.name || gameData.name.trim().length < APP_CONFIG.VALIDATION.MIN_GAME_NAME_LENGTH) {
    errors.push('Game name is required');
  }
  
  if (gameData.name && gameData.name.length > APP_CONFIG.VALIDATION.MAX_GAME_NAME_LENGTH) {
    errors.push(`Game name must be less than ${APP_CONFIG.VALIDATION.MAX_GAME_NAME_LENGTH} characters`);
  }
  
  // Check genre
  if (gameData.genre && gameData.genre.length > APP_CONFIG.VALIDATION.MAX_GENRE_LENGTH) {
    errors.push(`Genre must be less than ${APP_CONFIG.VALIDATION.MAX_GENRE_LENGTH} characters`);
  }
  
  // Check description
  if (gameData.desc && gameData.desc.length > APP_CONFIG.VALIDATION.MAX_DESC_LENGTH) {
    errors.push(`Description must be less than ${APP_CONFIG.VALIDATION.MAX_DESC_LENGTH} characters`);
  }
  
  // Check trailer URL
  if (gameData.trailer && !isValidURL(gameData.trailer)) {
    errors.push('Trailer must be a valid URL');
  }
  
  return {
    isValid: errors.length === 0,
    errors
  };
};


// ==================== VALIDATE URL ====================
const isValidURL = (string) => {
  try {
    new URL(string);
    return true;
  } catch (_) {
    return false;
  }
};


// ==================== GET NEXT AVAILABLE ID ====================
const getNextGameId = (games) => {
  if (games.length === 0) return 1000;
  
  const maxId = Math.max(...games.map(g => g.id));
  return maxId < 1000 ? 1000 : maxId + 1;
};

/*
  ============================================
  GAME SEARCH & AUTO-FILL
  ============================================
  
  This file searches the internet for game information
  and auto-fills the add game form.
  
  USES:
  - RAWG API (free, no key needed for basic use)
  - YouTube Data API (searches for trailers)
  - HowLongToBeat (estimated hours)
  
  ============================================
*/

const GameSearch = {
  
  // ==================== SEARCH FOR GAME ====================
  searchGame: async function(gameName) {
    if (!gameName || gameName.trim().length < 2) {
      return {
        success: false,
        error: 'Please enter a game name (at least 2 characters)'
      };
    }
    
    try {
      console.log('🔍 Searching for:', gameName);
      
      // Search using RAWG API (free, no key needed)
      const searchUrl = `https://api.rawg.io/api/games?search=${encodeURIComponent(gameName)}&page_size=5`;
      
      const response = await fetch(searchUrl);
      
      if (!response.ok) {
        throw new Error('Search failed');
      }
      
      const data = await response.json();
      
      if (!data.results || data.results.length === 0) {
        return {
          success: false,
          error: 'No games found. Try a different name.'
        };
      }
      
      // Return multiple results for user to choose
      const games = data.results.map(game => ({
        id: game.id,
        name: game.name,
        released: game.released,
        rating: game.rating,
        image: game.background_image,
        genres: game.genres?.map(g => g.name).join(', ') || 'Unknown',
        platforms: game.platforms?.map(p => p.platform.name).join(', ') || ''
      }));
      
      return {
        success: true,
        games: games
      };
      
    } catch (error) {
      console.error('Search error:', error);
      return {
        success: false,
        error: 'Search failed. Please check your internet connection.'
      };
    }
  },
  
  
  // ==================== GET DETAILED GAME INFO ====================
  getGameDetails: async function(gameId) {
    try {
      console.log('📊 Fetching details for game ID:', gameId);
      
      // Get detailed info from RAWG
      const detailsUrl = `https://api.rawg.io/api/games/${gameId}`;
      const response = await fetch(detailsUrl);
      
      if (!response.ok) {
        throw new Error('Failed to get game details');
      }
      
      const game = await response.json();
      
      // Extract relevant information
      const gameData = {
        name: game.name,
        genre: game.genres?.map(g => g.name).join(', ') || 'Unknown',
        desc: game.description_raw ? 
              game.description_raw.substring(0, 300) + '...' : 
              'No description available',
        released: game.released,
        rating: game.rating,
        image: game.background_image,
        metacritic: game.metacritic,
        playtime: game.playtime ? `${game.playtime} hours` : null,
        platforms: game.platforms?.map(p => p.platform.name).join(', ') || '',
        esrb: game.esrb_rating?.name || 'Not Rated'
      };
      
      // Search for YouTube trailer
      const trailer = await this.searchYouTubeTrailer(game.name);
      if (trailer) {
        gameData.trailer = trailer;
      }
      
      // Estimate hours to beat based on playtime
      if (game.playtime && game.playtime > 0) {
        gameData.hours = `${game.playtime}-${game.playtime + 5}`;
      }
      
      // Generate emoji icon based on genre
      gameData.icon = this.getEmojiForGenre(game.genres?.[0]?.name || '');
      
      // Estimate FPS based on age and type
      gameData.fps = this.estimateFPS(game);
      
      // Determine tier (basic heuristic)
      gameData.tier = this.determineTier(game);
      
      return {
        success: true,
        data: gameData
      };
      
    } catch (error) {
      console.error('Error getting game details:', error);
      return {
        success: false,
        error: 'Failed to get game details'
      };
    }
  },
  
  
  // ==================== SEARCH YOUTUBE TRAILER ====================
  searchYouTubeTrailer: async function(gameName) {
    try {
      // Use YouTube's no-API search (less reliable but works without key)
      const searchQuery = encodeURIComponent(`${gameName} official trailer gameplay`);
      const youtubeSearchUrl = `https://www.youtube.com/results?search_query=${searchQuery}`;
      
      // For now, return a search URL that user can click
      // In a full implementation, you'd use YouTube Data API with a key
      return `https://www.youtube.com/results?search_query=${searchQuery}`;
      
    } catch (error) {
      console.error('YouTube search error:', error);
      return null;
    }
  },
  
  
  // ==================== GET EMOJI FOR GENRE ====================
  getEmojiForGenre: function(genre) {
    const emojiMap = {
      'Action': '⚔️',
      'Adventure': '🗺️',
      'RPG': '🎭',
      'Strategy': '🧠',
      'Shooter': '🔫',
      'Racing': '🏎️',
      'Sports': '⚽',
      'Puzzle': '🧩',
      'Platformer': '🏃',
      'Fighting': '🥊',
      'Horror': '👻',
      'Simulation': '✈️',
      'MMORPG': '🗡️',
      'Indie': '🎨',
      'Casual': '🎮',
      'Family': '👨‍👩‍👧‍👦',
      'Educational': '📚',
      'Card': '🃏',
      'Board Games': '🎲'
    };
    
    for (const [key, emoji] of Object.entries(emojiMap)) {
      if (genre.includes(key)) {
        return emoji;
      }
    }
    
    return '🎮'; // Default
  },
  
  
  // ==================== ESTIMATE FPS ====================
  estimateFPS: function(game) {
    const releaseYear = game.released ? parseInt(game.released.split('-')[0]) : 2020;
    const currentYear = new Date().getFullYear();
    const age = currentYear - releaseYear;
    
    // Newer games = lower FPS on your system
    if (age <= 2) {
      return '20-30';
    } else if (age <= 5) {
      return '30-45';
    } else if (age <= 8) {
      return '40-55';
    } else {
      return '50-60';
    }
  },
  
  
  // ==================== DETERMINE TIER ====================
  determineTier: function(game) {
    // Use metacritic score to suggest tier
    const score = game.metacritic || game.rating * 20;
    
    if (score >= 90) return 'S';
    if (score >= 80) return 'A';
    if (score >= 70) return 'B';
    return 'C';
  },
  
  
  // ==================== DOWNLOAD IMAGE ====================
  downloadImage: async function(imageUrl) {
    try {
      // Convert image URL to base64 for storage
      // Note: This might have CORS issues with some images
      const response = await fetch(imageUrl);
      const blob = await response.blob();
      
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    } catch (error) {
      console.error('Error downloading image:', error);
      return null;
    }
  }
  
};

          setSearchTerm={setSearchTerm}
          showSort={showSort}
          setShowSort={setShowSort}
          darkMode={darkMode}
        />
        
        {/* Sort options (appears when showSort is true) */}
        {showSort && APP_CONFIG.FEATURES.ENABLE_SORTING && (
          <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-xl p-3 mb-4`}>
            <div className="flex gap-2 flex-wrap">
              {[
                ['tier', 'By Tier'],
                ['name', 'By Name'],
                ['fps', 'By FPS'],
                ['rating', 'By Rating']
              ].map(([key, label]) => (
                <button
                  key={key}
                  onClick={() => setSortBy(key)}
                  className={`px-3 py-1 rounded text-sm transition-colors ${
                    sortBy === key 
                      ? 'bg-purple-600 text-white' 
                      : darkMode 
                        ? 'bg-gray-700 text-gray-300 hover:bg-gray-600' 
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                  }`}
                >
                  {label}
                </button>
              ))}
            </div>
          </div>
        )}
        
        {/* Stats cards */}
        <StatsCards stats={stats} darkMode={darkMode} />
        
        {/* Filter buttons */}
        <FilterButtons 
          filter={filter}
          setFilter={setFilter}
          stats={stats}
          darkMode={darkMode}
        />
        
        {/* Backup buttons */}
        <BackupButtons 
          onExport={handleExport}
          onImport={handleImport}
          darkMode={darkMode}
        />
        
        {/* Add game button/form */}
        {APP_CONFIG.FEATURES.ENABLE_ADD_GAME && (
          <div className="mb-4">
            {!showAddGame ? (
              <button
                onClick={() => setShowAddGame(true)}
                className="w-full bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl p-4 font-bold shadow-xl flex items-center justify-center gap-2 hover:from-purple-700 hover:to-pink-700 transition-all"
              >
                <Icon name="plus" size={20} /> Add New Game
              </button>
            ) : (
              <div className={`${darkMode ? 'bg-gray-800' : 'bg-white'} rounded-xl shadow-xl p-4`}>
                <form onSubmit={handleAddGame} className="space-y-3">
                  <div className="flex justify-between items-center mb-2">
                    <h3 className={`font-bold ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                      Add New Game
                    </h3>
                    <button 
                      type="button" 
                      onClick={() => setShowAddGame(false)}
                      className="text-gray-500 hover:text-gray-700"
                    >
                      ❌
                    </button>
                  </div>
                  
                  {/* Search Section */}
                  <div className="bg-gradient-to-r from-purple-100 to-pink-100 dark:from-purple-900 dark:to-pink-900 p-3 rounded-lg">
                    <label className={`block text-sm font-medium mb-2 ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                      🔍 Search for Game Information
                    </label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        placeholder="Type game name..."
                        value={newGame.name}
                        onChange={e => handleNewGameChange('name', e.target.value)}
                        className={`flex-1 p-2 border rounded ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                        disabled={isSearching}
                      />
                      <button
                        type="button"
                        onClick={handleSearchGame}
                        disabled={isSearching || !newGame.name}
                        className={`px-4 py-2 rounded font-bold transition-colors ${
                          isSearching || !newGame.name
                            ? 'bg-gray-400 cursor-not-allowed'
                            : 'bg-blue-500 hover:bg-blue-600 text-white'
                        }`}
                      >
                        {isSearching ? '⏳ Searching...' : '🔍 Search'}
                      </button>
                    </div>
                    <p className="text-xs mt-2 opacity-75">
                      Click Search to auto-fill game details from the internet
                    </p>
                  </div>
                  
                  {/* Search Results */}
                  {showSearchResults && searchResults.length > 0 && (
                    <div className={`p-3 rounded-lg border ${darkMode ? 'bg-gray-700 border-gray-600' : 'bg-gray-50 border-gray-300'}`}>
                      <p className={`text-sm font-medium mb-2 ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                        Select a game:
                      </p>
                      <div className="space-y-2 max-h-60 overflow-y-auto">
                        {searchResults.map(game => (
                          <button
                            key={game.id}
                            type="button"
                            onClick={() => handleSelectGame(game.id, game.name)}
                            className={`w-full text-left p-2 rounded transition-colors ${
                              darkMode 
                                ? 'bg-gray-600 hover:bg-gray-500' 
                                : 'bg-white hover:bg-gray-100'
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              {game.image && (
                                <img 
                                  src={game.image} 
                                  alt={game.name}
                                  className="w-12 h-12 object-cover rounded"
                                  onError={(e) => e.target.style.display = 'none'}
                                />
                              )}
                              <div className="flex-1">
                                <p className={`font-medium ${darkMode ? 'text-white' : 'text-gray-800'}`}>
                                  {game.name}
                                </p>
                                <p className="text-xs opacity-75">
                                  {game.released} • {game.genres}
                                </p>
                              </div>
                              {game.rating && (
                                <div className="text-yellow-500">
                                  ⭐ {game.rating}
                                </div>
                              )}
                            </div>
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        onClick={() => setShowSearchResults(false)}
                        className="w-full mt-2 text-sm text-gray-500 hover:text-gray-700"
                      >
                        Cancel
                      </button>
                    </div>
                  )}
                  
                  {/* Manual Entry Section */}
                  <div className={`p-2 rounded ${darkMode ? 'bg-gray-700' : 'bg-gray-50'}`}>
                    <p className="text-xs opacity-75 mb-2">
                      Or enter manually (all fields are editable):
                    </p>
                  
                    <p className="text-xs opacity-75 mb-2">
                      Or enter manually (all fields are editable):
                    </p>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="text"
                      placeholder="Genre"
                      value={newGame.genre}
                      onChange={e => handleNewGameChange('genre', e.target.value)}
                      className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                    />
                    <input
                      type="text"
                      placeholder="FPS (e.g. 30-40)"
                      value={newGame.fps}
                      onChange={e => handleNewGameChange('fps', e.target.value)}
                      className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                    />
                  </div>
                  
                  <div className="grid grid-cols-2 gap-2">
                    <input
                      type="text"
                      placeholder="Hours (e.g. 10-12)"
                      value={newGame.hours}
                      onChange={e => handleNewGameChange('hours', e.target.value)}
                      className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                    />
                    <input
                      type="text"
                      placeholder="Icon (emoji)"
                      value={newGame.icon}
                      onChange={e => handleNewGameChange('icon', e.target.value)}
                      className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                    />
                  </div>
                  
                  <select
                    value={newGame.tier}
                    onChange={e => handleNewGameChange('tier', e.target.value)}
                    className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                  >
                    {Object.keys(APP_CONFIG.TIERS).map(tier => (
                      <option key={tier} value={tier}>
                        {tier} - {APP_CONFIG.TIERS[tier].label}
                      </option>
                    ))}
                  </select>
                  
                  <input
                    type="url"
                    placeholder="YouTube Trailer URL"
                    value={newGame.trailer}
                    onChange={e => handleNewGameChange('trailer', e.target.value)}
                    className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                  />
                  
                  <textarea
                    placeholder="Description"
                    value={newGame.desc}
                    onChange={e => handleNewGameChange('desc', e.target.value)}
                    className={`w-full p-2 border rounded text-sm ${darkMode ? 'bg-gray-700 text-white border-gray-600' : 'border-gray-300'}`}
                    rows="2"
                  />
                  
                  <div className="flex gap-2">
                    <button type="submit" className="flex-1 bg-green-500 text-white p-2 rounded font-bold hover:bg-green-600 transition-colors">
                      Save Game
                    </button>
                    <button type="button" onClick={() => setShowAddGame(false)} className="flex-1 bg-gray-300 text-gray-700 p-2 rounded font-bold hover:bg-gray-400 transition-colors">
                      Cancel
                    </button>
                  </div>
                  </div>
                </form>
              </div>
            )}
          </div>
        )}
        
        {/* Game list */}
        <div className="space-y-3">
          {displayedGames.length > 0 ? (
            displayedGames.map(game => (
              <GameCard
                key={game.id}
                game={game}
                darkMode={darkMode}
                isExpanded={expandedGameId === game.id}
                onToggleExpand={() => handleToggleExpand(game.id)}
                onUpdateStatus={handleUpdateStatus}
                onUpdateRating={handleUpdateRating}
                onUpdateNotes={handleUpdateNotes}
                onDelete={handleDeleteGame}
              />
            ))
          ) : (
            <EmptyState 
              darkMode={darkMode}
              searchTerm={searchTerm}
              filter={filter}
            />
          )}
        </div>
        
        {/* Legend */}
        <Legend darkMode={darkMode} />
        
        {/* Footer */}
        <Footer darkMode={darkMode} />
        
      </div>
    </div>
  );
};

// ========== RENDER APP ==========
ReactDOM.render(<GamingChecklistApp />, document.getElementById('root'));

  Modify layout:
  - Change JSX structure in return statement

  </script>

  <script>
    // PWA init - runs after React is ready
    (function() {
      'use strict';
      var deferredPrompt = null;

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('service-worker.js')
            .then(function(reg) { console.log('SW registered'); })
            .catch(function(err) { console.log('SW failed:', err); });
        });
      }

      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        var dismissed = localStorage.getItem('installPromptDismissed');
        var daysSince = dismissed ? (Date.now() - parseInt(dismissed)) / 86400000 : 999;
        if (daysSince > 7) {
          setTimeout(function() {
            var el = document.getElementById('installPrompt');
            if (el) el.classList.add('show');
          }, 3000);
        }
      });

      document.addEventListener('click', function(e) {
        if (e.target.id === 'installBtn' && deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
          var el = document.getElementById('installPrompt');
          if (el) el.classList.remove('show');
        }
        if (e.target.id === 'dismissBtn') {
          var el = document.getElementById('installPrompt');
          if (el) el.classList.remove('show');
          localStorage.setItem('installPromptDismissed', Date.now().toString());
        }
      });
    })();
  </script>
