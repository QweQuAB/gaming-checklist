<!DOCTYPE html>
<html lang="en" data-theme="void">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GameList">
  <link rel="manifest" href="manifest.json">
  <title>Q's Gaming Checklist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* THEMES */
    :root,[data-theme="void"]{--bg1:#0f0c29;--bg2:#302b63;--bg3:#24243e;--card:#1e1b4bcc;--card-solid:#1e1b4b;--bord:#312e81;--tx:#e2e8f0;--sub:#94a3b8;--muted:#64748b;--acc:#7c3aed;--acc2:#ec4899;--atext:#fff;--hgrad:linear-gradient(135deg,#667eea,#764ba2);--btn:#312e8188;--btntx:#c4b5fd;--overlay:rgba(12,10,35,0.80);--inp:#1e1b4b;--inpb:#4338ca;--sc:#7c3aed;}
    [data-theme="cyber"]{--bg1:#000;--bg2:#0d1117;--bg3:#001100;--card:#0d1117cc;--card-solid:#0d1117;--bord:#00ff4122;--tx:#00ff41;--sub:#00cc33;--muted:#009922;--acc:#00ff41;--acc2:#00ccff;--atext:#000;--hgrad:linear-gradient(135deg,#003300,#00ff41);--btn:#0a1f0a88;--btntx:#00ff41;--overlay:rgba(0,0,0,0.88);--inp:#0a1f0a;--inpb:#00ff4155;--sc:#00ff41;}
    [data-theme="arctic"]{--bg1:#dbeafe;--bg2:#ede9fe;--bg3:#fce7f3;--card:#ffffffdd;--card-solid:#fff;--bord:#e2e8f0;--tx:#1e293b;--sub:#475569;--muted:#94a3b8;--acc:#3b82f6;--acc2:#8b5cf6;--atext:#fff;--hgrad:linear-gradient(135deg,#3b82f6,#8b5cf6);--btn:#f1f5f988;--btntx:#475569;--overlay:rgba(219,234,254,0.65);--inp:#f8fafc;--inpb:#cbd5e1;--sc:#3b82f6;}
    [data-theme="ember"]{--bg1:#1a0500;--bg2:#2d0f00;--bg3:#1a0000;--card:#1f0a05cc;--card-solid:#1f0a05;--bord:#7c2d0c;--tx:#fef3c7;--sub:#fcd34d;--muted:#d97706;--acc:#dc2626;--acc2:#ea580c;--atext:#fff;--hgrad:linear-gradient(135deg,#dc2626,#ea580c);--btn:#2d0f0588;--btntx:#fcd34d;--overlay:rgba(26,5,0,0.85);--inp:#2d0f05;--inpb:#7c2d0c;--sc:#dc2626;}
    [data-theme="slate"]{--bg1:#020617;--bg2:#0f172a;--bg3:#020617;--card:#0f172acc;--card-solid:#0f172a;--bord:#1e293b;--tx:#f1f5f9;--sub:#94a3b8;--muted:#64748b;--acc:#0ea5e9;--acc2:#6366f1;--atext:#fff;--hgrad:linear-gradient(135deg,#0ea5e9,#6366f1);--btn:#1e293b88;--btntx:#94a3b8;--overlay:rgba(2,6,23,0.85);--inp:#1e293b;--inpb:#334155;--sc:#0ea5e9;}

    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;-webkit-overflow-scrolling:touch}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));color:var(--tx);overflow-x:hidden;min-height:100vh;}
    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-thumb{background:var(--sc);border-radius:99px;opacity:.5}
    ::-webkit-scrollbar-track{background:transparent}

    /* BG SLIDESHOW */
    .bg-layer{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s ease}
    .bg-layer.show{opacity:1}
    .bg-dim{position:fixed;inset:0;z-index:1;background:var(--overlay);pointer-events:none}
    #app-root{position:relative;z-index:2;min-height:100vh}

    /* LOADING */
    .loader-wrap{position:fixed;inset:0;z-index:9999;background:var(--hgrad);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .6s}
    .loader-wrap.hide{opacity:0;pointer-events:none}
    .spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* INSTALL PROMPT */
    .install-p{position:fixed;bottom:16px;left:16px;right:16px;background:var(--hgrad);color:#fff;padding:14px;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.4);display:none;z-index:8000}
    .install-p.show{display:block}
    .install-p .btns{display:flex;gap:8px;margin-top:10px}
    .install-p .btns button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:12px}
    #iBtn{background:#fff;color:#764ba2}#dBtn{background:rgba(255,255,255,.2);color:#fff}

    /* CARD */
    .card{background:var(--card);border:1px solid var(--bord);border-radius:14px;backdrop-filter:blur(8px)}
    .card-solid{background:var(--card-solid);border:1px solid var(--bord);border-radius:14px}
    .card:hover{border-color:var(--acc);transition:border-color .2s}

    /* INPUT */
    .inp{background:var(--inp);border:1px solid var(--inpb);color:var(--tx);border-radius:8px;padding:8px 12px;font-size:13px;width:100%;outline:none;transition:border-color .15s}
    .inp:focus{border-color:var(--acc)}
    .inp::placeholder{color:var(--muted)}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;border:none;transition:opacity .15s,transform .1s}
    .btn:hover{opacity:.88;transform:translateY(-1px)}
    .btn:active{transform:scale(.97)}
    .btn-acc{background:var(--acc);color:var(--atext)}
    .btn-acc2{background:var(--acc2);color:#fff}
    .btn-muted{background:var(--btn);color:var(--btntx)}
    .btn-red{background:#dc2626;color:#fff}
    .btn-green{background:#16a34a;color:#fff}
    .btn-blue{background:#2563eb;color:#fff}

    /* STATUS BUTTONS */
    .srow{display:flex;gap:3px;padding:0 10px 10px}
    .sbtn{flex:1;padding:4px 2px;border:none;border-radius:6px;font-size:9px;font-weight:700;cursor:pointer;color:#fff;opacity:.3;transition:all .15s}
    .sbtn.on{opacity:1;transform:scale(1.06);box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .sbtn:hover:not(.on){opacity:.6}
    .s0{background:#6b7280}.s1{background:#3b82f6}.s2{background:#22c55e}.s3{background:#a855f7}.s4{background:#eab308}

    /* SIDEBAR PANEL */
    .spanel{background:var(--card-solid);border:1px solid var(--bord);border-radius:14px;overflow:hidden}
    .stabs{display:flex;gap:3px;padding:8px;overflow-x:auto;border-bottom:1px solid var(--bord);-ms-overflow-style:none;scrollbar-width:none}
    .stabs::-webkit-scrollbar{display:none}
    .stab{padding:5px 9px;border-radius:7px;font-size:10px;font-weight:700;white-space:nowrap;cursor:pointer;border:none;background:var(--btn);color:var(--btntx);transition:all .15s}
    .stab.on{background:var(--acc);color:var(--atext)}
    .sitem{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border-bottom:1px solid var(--bord);transition:background .15s;text-decoration:none}
    .sitem:last-child{border-bottom:none}
    .sitem:hover{background:rgba(255,255,255,.04)}
    .simg{width:42px;height:56px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--bord)}
    .simg-sq{width:42px;height:42px;object-fit:cover;border-radius:6px;flex-shrink:0;background:var(--bord)}
    .yt-img{width:76px;height:43px;object-fit:cover;border-radius:6px;flex-shrink:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center}
    .sttl{font-size:11px;font-weight:600;color:var(--tx);line-height:1.35;margin-bottom:2px}
    .smeta{font-size:10px;color:var(--sub)}
    .badge{display:inline-block;padding:1px 5px;border-radius:99px;font-size:9px;font-weight:700}
    .badge-new{background:#ec4899;color:#fff}
    .badge-mc{background:#16a34a;color:#fff}

    /* TILE VIEW */
    .tiles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    @media(min-width:480px){.tiles-grid{grid-template-columns:repeat(4,1fr)}}
    @media(min-width:640px){.tiles-grid{grid-template-columns:repeat(5,1fr)}}
    @media(min-width:1024px){.tiles-grid{grid-template-columns:repeat(3,1fr)}}
    .tile-card{border-radius:10px;overflow:hidden;cursor:pointer;position:relative;aspect-ratio:2/3;border:1px solid var(--bord);transition:transform .15s}
    .tile-card:hover{transform:scale(1.03)}
    .tile-img{width:100%;height:100%;object-fit:cover}
    .tile-fb{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--card-solid)}
    .tile-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 55%)}
    .tile-badge{position:absolute;top:5px;left:5px;padding:2px 5px;border-radius:4px;font-size:8px;font-weight:800;color:#fff}
    .tile-status-dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
    .tile-name{position:absolute;bottom:6px;left:5px;right:5px;font-size:9px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);line-height:1.3}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
    .modal-box{background:var(--card-solid);border:1px solid var(--bord);border-radius:18px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto}

    /* TOAST */
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--acc);color:var(--atext);padding:10px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:9000;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.4);animation:toastIn .3s ease;pointer-events:none}
    @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* PROGRESS */
    .pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
    .pfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s ease}

    /* THEME SWATCHES */
    .swatch{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
    .swatch.on{border-color:#fff;transform:scale(1.25)}

    /* SETTINGS PAGE */
    .settings-page{position:fixed;inset:0;z-index:7000;background:linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));overflow-y:auto;padding:16px}
    .settings-section{background:var(--card-solid);border:1px solid var(--bord);border-radius:14px;padding:16px;margin-bottom:12px}
    .settings-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
    .settings-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bord)}
    .settings-row:last-child{border-bottom:none}
    .toggle{width:40px;height:22px;border-radius:99px;cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
    .toggle.on{background:var(--acc)}
    .toggle.on::after{transform:translateX(18px)}
    .toggle.off{background:var(--muted)}
    select.inp{appearance:none;cursor:pointer}

    /* GRID */
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

    /* VIEW LIST */
    .vlist{display:flex;flex-direction:column;gap:8px}
    .vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    @media(min-width:640px){.vgrid{grid-template-columns:repeat(3,1fr)}}

    /* ANIMATIONS */
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .fade-up{animation:fadeUp .2s ease both}
    .pulse{animation:pulse 1.5s ease-in-out infinite}

    /* RESPONSIVE MAIN LAYOUT */
    .main-layout{display:flex;flex-direction:column;gap:12px;max-width:1440px;margin:0 auto;padding:12px}
    @media(min-width:768px){
      .main-layout{flex-direction:row;align-items:flex-start}
      .left-col{width:240px;flex-shrink:0}
      .mid-col{flex:1;min-width:0}
      .right-col{width:260px;flex-shrink:0}
    }
    @media(min-width:1280px){
      .left-col{width:260px}
      .right-col{width:280px}
    }
    /* Mobile: show panels as collapsible */
    .side-col-mobile{display:block}
    @media(min-width:768px){.side-col-mobile{display:none}}
    @media(max-width:767px){.left-col,.right-col{display:none}.side-col-mobile{display:block}}

    /* STICKY SIDEBAR */
    @media(min-width:768px){
      .sticky-panel{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
    }
    .spanel-scroll{overflow-y:auto}
    @media(min-width:768px){.spanel-scroll{max-height:500px}}

    /* GRID CARD */
    .gcard{background:var(--card-solid);border:1px solid var(--bord);border-radius:12px;overflow:hidden}
    .gcard-img{width:100%;height:140px;object-fit:cover}
    .gcard-fb{width:100%;height:140px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:var(--bord)}
  </style>
</head>
<body>
<div class="loader-wrap" id="LW"><div class="spinner"></div><h2 style="font-size:20px;font-weight:800;margin-bottom:6px">🎮 Gaming Checklist</h2><p style="font-size:13px;opacity:.8">Loading your world...</p></div>
<div class="install-p" id="IP"><div style="display:flex;align-items:center;gap:10px"><div style="font-size:28px">🎮</div><div><div style="font-weight:700;font-size:14px">Install Gaming Checklist</div><div style="font-size:11px;opacity:.8">Get the full app experience</div></div></div><div class="btns"><button id="iBtn">Install</button><button id="dBtn">Later</button></div></div>
<div class="bg-layer" id="bgA"></div>
<div class="bg-layer" id="bgB"></div>
<div class="bg-dim"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
'use strict';
var RKEY='c2ad28b9e8594e72bf24b87c05bc84c7';
var R2J='https://api.rss2json.com/v1/api.json?rss_url=';
function rawg(p){return fetch('https://api.rawg.io/api/'+p+(p.includes('?')?'&':'?')+'key='+RKEY).then(function(r){return r.json();});}
function rssFetch(url){return fetch(R2J+encodeURIComponent(url)).then(function(r){return r.json();});}

var loaderEl=document.getElementById('LW');
function hideLoader(){if(loaderEl)loaderEl.classList.add('hide');}
window.addEventListener('error',function(){setTimeout(hideLoader,800);});

// THEMES
var THEMES=[
  {id:'void',  name:'Void',   sw:'linear-gradient(135deg,#667eea,#764ba2)', desc:'Deep Space'},
  {id:'cyber', name:'Cyber',  sw:'linear-gradient(135deg,#003300,#00ff41)', desc:'Neon Matrix'},
  {id:'arctic',name:'Arctic', sw:'linear-gradient(135deg,#3b82f6,#8b5cf6)', desc:'Clean Ice'},
  {id:'ember', name:'Ember',  sw:'linear-gradient(135deg,#dc2626,#ea580c)', desc:'Dark Fire'},
  {id:'slate', name:'Slate',  sw:'linear-gradient(135deg,#0ea5e9,#6366f1)', desc:'Pro Dark'}
];

// CONFIG
var C={
  APP:'Q\'s Gaming Checklist',VER:'4.0.0',AUTH:'Q',
  SK:'gcData',DK:'gcDark',IK:'gcImgs',TK:'gcTheme',VK:'gcView',
  BK:'gcBg',BGS:'gcBgSpeed',NK:'gcNotifSeen',RK:'gcRawgToken',RUK:'gcRawgUser',
  TIERS:{S:{l:'MUST PLAY',hex:'#ef4444'},A:{l:'EXCELLENT',hex:'#f97316'},B:{l:'WORTH IT',hex:'#eab308'},C:{l:'CLASSICS',hex:'#16a34a'},R:{l:'RACING',hex:'#3b82f6'}},
  TO:{S:0,A:1,B:2,C:3,R:4},
  SC:['not_downloaded','downloaded','playing','completed','favorite']
};

// GAMES
var GD=[
  {id:1, name:"Batman: Arkham City",        genre:"Action-Adventure",    fps:"45-60",tier:"S",trailer:"https://youtu.be/9pnK8akbd2M",desc:"Become the Dark Knight in an open-world Gotham prison.",hours:"12-15",icon:"🦇"},
  {id:2, name:"Deus Ex: Human Revolution",  genre:"RPG/Stealth",         fps:"50-60",tier:"S",trailer:"https://youtu.be/Kq5KWLqUewc",desc:"Cyberpunk RPG where your choices matter.",hours:"20-25",icon:"🤖"},
  {id:3, name:"The Witcher 2",              genre:"Fantasy RPG",         fps:"40-50",tier:"S",trailer:"https://youtu.be/YJ_KFwNLpl0",desc:"Hunt monsters as Geralt in this dark fantasy.",hours:"25-30",icon:"⚔️"},
  {id:4, name:"Spec Ops: The Line",         genre:"Third-Person Shooter",fps:"50-60",tier:"S",trailer:"https://youtu.be/3uUsdBfG6o0",desc:"Military shooter exploring war's horrors.",hours:"6-8",icon:"🎖️"},
  {id:5, name:"Metro: Last Light Redux",    genre:"FPS/Horror",          fps:"35-45",tier:"S",trailer:"https://youtu.be/8jcIYP8LpxA",desc:"Survive post-apocalyptic Moscow metro tunnels.",hours:"10-12",icon:"🚇"},
  {id:6, name:"Dishonored",                genre:"Stealth/Action",      fps:"50-60",tier:"S",trailer:"https://youtu.be/E1HlYTukh9A",desc:"Supernatural assassin with choice-based gameplay.",hours:"12-15",icon:"🗡️"},
  {id:7, name:"Tomb Raider (2013)",         genre:"Action-Adventure",    fps:"45-55",tier:"S",trailer:"https://youtu.be/xCe8-1dbXZc",desc:"Lara Croft's origin story on a dangerous island.",hours:"11-14",icon:"🏹"},

  {id:48,name:"The Crew",                   genre:"Racing",              fps:"35-45",tier:"R",trailer:"https://youtu.be/k9TcSHzEsqQ",desc:"Drive across entire USA.",hours:"20-30",icon:"🗺️"}
];

// STORAGE
function lget(k,fb){try{var v=localStorage.getItem(k);return v!==null?JSON.parse(v):fb;}catch(e){return fb;}}
function lset(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function loadGames(){
  var s=lget(C.SK,null);

          h('select',{value:settings.bgSpeed||7,onChange:function(e){update('bgSpeed',parseInt(e.target.value));},className:'inp',style:{width:90}},
            [3,5,7,10,15,30].map(function(n){return h('option',{key:n,value:n},n+'s');}))
        )
      ),

      h('div',{className:'settings-section'},

        h('div',{className:'settings-row'},
          h('div',null,h('p',{style:{fontSize:13,fontWeight:600,color:'var(--tx)'}},'Default View'),h('p',{style:{fontSize:11,color:'var(--muted)'}},'List, Grid, or Tiles')),
          h('select',{value:settings.view||'list',onChange:function(e){update('view',e.target.value);},className:'inp',style:{width:80}},
            h('option',{value:'list'},'List'),h('option',{value:'grid'},'Grid'),h('option',{value:'tiles'},'Tiles'))
        ),
        h('div',{className:'settings-row'},
          h('div',null,h('p',{style:{fontSize:13,fontWeight:600,color:'var(--tx)'}},'Default Sort'),h('p',{style:{fontSize:11,color:'var(--muted)'}},'Initial sort order')),
          h('select',{value:settings.sort||'tier',onChange:function(e){update('sort',e.target.value);},className:'inp',style:{width:90}},
            h('option',{value:'tier'},'By Tier'),h('option',{value:'name'},'By Name'),h('option',{value:'fps'},'By FPS'),h('option',{value:'rating'},'By Rating'))
        ),
        h('div',{className:'settings-row'},
          h('div',null,h('p',{style:{fontSize:13,fontWeight:600,color:'var(--tx)'}},'Compact Cards'),h('p',{style:{fontSize:11,color:'var(--muted)'}},'Reduce card padding')),
          h(Toggle,{k:'compact'})
        ),
        h('div',{className:'settings-row'},
          h('div',null,h('p',{style:{fontSize:13,fontWeight:600,color:'var(--tx)'}},'Show Hours on Card'),h('p',{style:{fontSize:11,color:'var(--muted)'}},'Display estimated play time')),
          h(Toggle,{k:'showHours'})
        )
      ),

      // DATA
      h('div',{className:'settings-section'},
        h('p',{className:'settings-label'},'💾 Data'),
        h('button',{onClick:function(){var b=new Blob([JSON.stringify(p.games,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);var a=document.createElement('a');a.href=u;a.download='gaming-backup-'+Date.now()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(u);},100);},className:'btn btn-green',style:{width:'100%',justifyContent:'center',marginBottom:8,padding:'10px 0'}},h(Ico,{n:'download',s:14}),' Export All Games'),
        h('label',{className:'btn btn-blue',style:{width:'100%',justifyContent:'center',padding:'10px 0',cursor:'pointer',display:'flex',gap:5,alignItems:'center'}},
          h(Ico,{n:'upload',s:14}),' Import Games',
          h('input',{type:'file',accept:'.json',style:{display:'none'},onChange:function(e){
            var file=e.target.files[0];if(!file)return;
            var reader=new FileReader();reader.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(confirm('Import '+d.length+' games? This replaces your current list.'))p.setGames(d);}catch(err){alert('Invalid file.');}};
            reader.readAsText(file);e.target.value='';
          }})
        ),
        h('button',{onClick:function(){if(confirm('⚠️ Clear ALL data? This cannot be undone.')){localStorage.clear();window.location.reload();}},className:'btn btn-red',style:{width:'100%',justifyContent:'center',marginTop:8,padding:'10px 0'}},'🗑 Clear All Data')
      ),

      // RAWG SYNC
      h('div',{className:'settings-section'},
        h('p',{className:'settings-label'},'🔗 RAWG Profile Sync'),
        h('p',{style:{fontSize:11,color:'var(--sub)',marginBottom:12,lineHeight:1.6}},'Connect your RAWG account to view your profile. Get your token from rawg.io → Profile → API Key.'),
        h('div',{style:{marginBottom:8}},
          h('p',{style:{fontSize:11,color:'var(--muted)',marginBottom:4}},'RAWG Username'),
          h('input',{type:'text',placeholder:'your-username',value:rawgUser,onChange:function(e){setRawgUser(e.target.value);},className:'inp'})
        ),
        h('div',{style:{marginBottom:12}},
          h('p',{style:{fontSize:11,color:'var(--muted)',marginBottom:4}},'API Token'),
          h('input',{type:'password',placeholder:'Your RAWG API key',value:rawgToken,onChange:function(e){setRawgToken(e.target.value);},className:'inp'})
        ),
        rawgUser&&h('a',{href:'https://rawg.io/profile/'+rawgUser,target:'_blank',rel:'noopener noreferrer',className:'btn btn-acc',style:{display:'flex',justifyContent:'center',marginBottom:8,padding:'10px 0',textDecoration:'none'}},h(Ico,{n:'link',s:14}),' View My RAWG Profile'),
        h('div',{className:'flex gap-2'},
          h('button',{onClick:saveRawg,className:'btn btn-muted flex-1',style:{padding:'10px 0'}},'Save Credentials'),
          h('button',{onClick:syncToRawg,disabled:isSyncing,className:'btn btn-acc2 flex-1',style:{padding:'10px 0'}},h(Ico,{n:'sync',s:14}),' Sync Status')
        ),
        syncMsg&&h('p',{style:{fontSize:11,color:'var(--sub)',marginTop:10,padding:10,background:'var(--btn)',borderRadius:8,lineHeight:1.6}},syncMsg)
      ),

      // APP INFO
      h('div',{className:'settings-section'},
        h('p',{className:'settings-label'},'ℹ️ About'),
        h('div',{className:'settings-row'},h('p',{style:{fontSize:12,color:'var(--sub)'}},'App Name'),h('p',{style:{fontSize:12,fontWeight:600,color:'var(--tx)'}},C.APP)),
        h('div',{className:'settings-row'},h('p',{style:{fontSize:12,color:'var(--sub)'}},'Version'),h('p',{style:{fontSize:12,fontWeight:600,color:'var(--tx)'}},C.VER)),
        h('div',{className:'settings-row'},h('p',{style:{fontSize:12,color:'var(--sub)'}},'Games in list'),h('p',{style:{fontSize:12,fontWeight:600,color:'var(--tx)'}},p.games.length)),
        h('a',{href:'https://rawg.io',target:'_blank',rel:'noopener noreferrer',style:{display:'block',textAlign:'center',marginTop:10,fontSize:11,color:'var(--muted)',textDecoration:'none'}},'Powered by RAWG.io API')
      )
    )
  );
}

// ── MAIN APP ────────────────────────────────────────────────────────
function App(){
  var gs=useState(function(){return loadGames();});var games=gs[0];var setGames=gs[1];

  // Settings as one object
  var initSettings={theme:lget(C.TK,'void'),view:lget(C.VK,'list'),bgOn:lget(C.BK,true),bgSpeed:lget(C.BGS,7),sort:'tier',compact:false,showHours:true};
  var ss=useState(initSettings);var settings=ss[0];var setSettings=ss[1];
  function updateSetting(k,v){setSettings(function(prev){var n=Object.assign({},prev);n[k]=v;lset({theme:C.TK,view:C.VK,bgOn:C.BK,bgSpeed:C.BGS}[k]||k,v);return n;});}

  var vs=useState(null);var viewPage=vs[0];var setViewPage=vs[1]; // 'settings' or null
  var es=useState(null);var expId=es[0];var setExpId=es[1];
  var tp=useState(null);var tilePopup=tp[0];var setTilePopup=tp[1];
  var flt=useState('all');var filter=flt[0];var setFilter=flt[1];
  var qs=useState('');var q=qs[0];var setQ=qs[1];
  var srt=useState(settings.sort||'tier');var sort=srt[0];var setSort=srt[1];
  var shs=useState(false);var showSort=shs[0];var setShowSort=shs[1];
  var as=useState(false);var showAdd=as[0];var setShowAdd=as[1];
  var ic=useState(function(){return lget(C.IK,{});});var imgCache=ic[0];var setImgCache=ic[1];

  useEffect(function(){lset(C.SK,games);},[games]);
  useEffect(function(){lset(C.IK,imgCache);},[imgCache]);
  useEffect(function(){setTimeout(hideLoader,500);},[]);

  // Apply theme
  useEffect(function(){document.documentElement.setAttribute('data-theme',settings.theme);},[settings.theme]);

  // BG slideshow
  useEffect(function(){
    if(!settings.bgOn){stopBg();return;}
    var imgs=games.map(function(g){return imgCache[g.id]||g.image||'';}).filter(Boolean);
    if(imgs.length>0)initBg(imgs,settings.bgSpeed);
    return function(){if(!settings.bgOn)stopBg();};
  },[settings.bgOn,settings.bgSpeed,imgCache]);

  // Auto-fetch cover art
  useEffect(function(){
    var missing=games.filter(function(g){return !imgCache[g.id]&&!g.image;});
    if(!missing.length)return;
    var i=0;
    function next(){
      if(i>=missing.length)return;
      var g=missing[i++];
      rawg('games?search='+encodeURIComponent(g.name)+'&page_size=1&exact=true')
        .then(function(d){var r=(d.results||[])[0];if(r&&r.background_image){setImgCache(function(prev){var n=Object.assign({},prev);n[g.id]=r.background_image;return n;});}})
        .catch(function(){}).then(function(){setTimeout(next,400);});
    }
    next();
  },[]);

  var shown=games.filter(function(g){
    if(filter!=='all'&&g.status!==filter)return false;
    if(q){var t=q.toLowerCase();return g.name.toLowerCase().includes(t)||g.genre.toLowerCase().includes(t)||(g.desc||'').toLowerCase().includes(t);}
    return true;
  }).sort(function(a,b){
    if(sort==='name')return a.name.localeCompare(b.name);
    if(sort==='fps')return parseInt((b.fps||'0').split('-').pop()||0)-parseInt((a.fps||'0').split('-').pop()||0);
    if(sort==='rating')return(b.rating||0)-(a.rating||0);
    var o=C.TO;if(o[a.tier]!==o[b.tier])return o[a.tier]-o[b.tier];return a.name.localeCompare(b.name);
  });

  var total=games.length, playing=games.filter(function(g){return g.status==='playing';}).length;
  var completed=games.filter(function(g){return g.status==='completed';}).length;
  var fav=games.filter(function(g){return g.status==='favorite';}).length;
  var notdl=games.filter(function(g){return g.status==='not_downloaded';}).length;
  var dld=games.filter(function(g){return g.status==='downloaded';}).length;
  var pct=total>0?Math.round(((completed+fav)/total)*100):0;

  function upSt(id,ns){setGames(function(gs){return gs.map(function(g){return g.id===id?Object.assign({},g,{status:ns}):g;});});}
  function upRt(id,r){setGames(function(gs){return gs.map(function(g){return g.id===id?Object.assign({},g,{rating:r}):g;});});}
  function upNt(id,n){setGames(function(gs){return gs.map(function(g){return g.id===id?Object.assign({},g,{notes:n}):g;});});}
  function delG(id){setGames(function(gs){return gs.filter(function(g){return g.id!==id;});});setExpId(null);}
  function addG(gd){setGames(function(gs){return gs.concat([gd]);});}

  var filters=[['all','All',total],['not_downloaded','Not DL',notdl],['downloaded',"DL'd",dld],['playing','Playing',playing],['completed','Done',completed],['favorite','Fav',fav]];
  var cardPad=settings.compact?'p-2':'p-3';

  // Find tile popup game
  var tpGame=tilePopup?games.find(function(g){return g.id===tilePopup;}):null;

  if(viewPage==='settings'){
    return h(SettingsPage,{settings:settings,update:updateSetting,games:games,setGames:setGames,onClose:function(){setViewPage(null);}});
  }

  return h('div',{id:'app-layout'},
    // Tile popup
    tpGame&&h(TilePopup,{g:tpGame,cover:imgCache[tpGame.id]||null,onClose:function(){setTilePopup(null);},onSt:function(id,ns){upSt(id,ns);setGames(function(gs){return gs.map(function(g){return g.id===id?Object.assign({},g,{status:ns}):g;});});},onRt:upRt}),

    h('div',{className:'main-layout'},

      // LEFT SIDEBAR (desktop only)
      h('div',{className:'left-col sticky-panel'},h(LeftSidebar,{onAdd:addG})),

      // MIDDLE COLUMN
      h('div',{className:'mid-col',style:{display:'flex',flexDirection:'column',gap:10}},

        // HEADER
        h('div',{className:'card-solid',style:{padding:14}},
          h('div',{className:'flex items-start justify-between gap-2',style:{marginBottom:12}},
            h('div',null,
              h('h1',{style:{fontWeight:900,fontSize:18,letterSpacing:'-0.02em',color:'var(--tx)'}},C.APP),
              h('p',{style:{fontSize:11,color:'var(--muted)',marginTop:2}},'Tap status buttons • Expand cards for details')
            ),
            h('div',{className:'flex items-center gap-1.5'},
              // Theme swatches
              h('div',{className:'flex gap-1'},THEMES.map(function(t){return h('button',{key:t.id,onClick:function(){updateSetting('theme',t.id);},title:t.name,className:'swatch'+(settings.theme===t.id?' on':''),style:{background:t.sw}});})),
              // BG toggle
              h('button',{onClick:function(){updateSetting('bgOn',!settings.bgOn);},title:'Toggle BG artwork',style:{padding:6,borderRadius:8,background:settings.bgOn?'var(--acc)22':'var(--btn)',border:'none',cursor:'pointer',color:settings.bgOn?'var(--acc)':'var(--muted)'}},h(Ico,{n:'image',s:14})),
              // Settings
              h('button',{onClick:function(){setViewPage('settings');},style:{padding:6,borderRadius:8,background:'var(--btn)',border:'none',cursor:'pointer',color:'var(--muted)'}},h(Ico,{n:'gear',s:14}))
            )
          ),
          h('div',{className:'flex justify-between items-center',style:{fontSize:11,color:'var(--muted)',marginBottom:4}},
            h('span',null,'Completion'),h('span',{style:{fontWeight:700,color:'var(--tx)'}},(completed+fav)+'/'+total+' ('+pct+'%)'));
          h('div',{className:'pbar'},h('div',{className:'pfill',style:{width:pct+'%'}})),
          // Stats
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginTop:10}},
            [['Total',total,'var(--acc)'],['Playing',playing,'#22c55e'],['Done',completed+fav,'#a855f7'],['Fav',fav,'#eab308']].map(function(s,i){
              return h('div',{key:i,style:{textAlign:'center',padding:'6px 4px',borderRadius:10,background:'var(--btn)'}},
                h('div',{style:{fontWeight:900,fontSize:18,color:s[2]}},s[1]),
                h('div',{style:{fontSize:10,color:'var(--muted)'}},s[0])
              );
            })
          )
        ),

        // SEARCH + VIEW + SORT
        h('div',{className:'card-solid',style:{padding:10}},
          h('div',{className:'flex gap-2',style:{marginBottom:showSort?8:0}},
            h('div',{style:{flex:1,position:'relative'}},
              h('span',{style:{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'var(--muted)',pointerEvents:'none'}},h(Ico,{n:'search',s:15})),
              h('input',{type:'text',placeholder:'Search games...',value:q,onChange:function(e){setQ(e.target.value);},className:'inp',style:{paddingLeft:34}})
            ),
            h('div',{style:{display:'flex',borderRadius:8,overflow:'hidden',border:'1px solid var(--bord)'}},
              [['list','list'],['grid','grid'],['tiles','tiles']].map(function(v){
                return h('button',{key:v[0],onClick:function(){updateSetting('view',v[0]);},title:v[0].charAt(0).toUpperCase()+v[0].slice(1),style:{padding:'8px 10px',background:settings.view===v[0]?'var(--acc)':'var(--btn)',color:settings.view===v[0]?'var(--atext)':'var(--muted)',border:'none',cursor:'pointer',transition:'all .15s'}},h(Ico,{n:v[1],s:14}));
              })
            ),
            h('button',{onClick:function(){setShowSort(!showSort);},style:{padding:'8px 10px',borderRadius:8,background:showSort?'var(--acc)':'var(--btn)',color:showSort?'var(--atext)':'var(--muted)',border:'none',cursor:'pointer'}},h(Ico,{n:'sliders',s:14}))
          ),
          showSort&&h('div',{className:'flex gap-2 flex-wrap'},
            [['tier','Tier'],['name','Name'],['fps','FPS'],['rating','Rating']].map(function(o){
              return h('button',{key:o[0],onClick:function(){setSort(o[0]);},style:{padding:'5px 10px',borderRadius:7,fontSize:11,fontWeight:700,border:'none',cursor:'pointer',background:sort===o[0]?'var(--acc)':'var(--btn)',color:sort===o[0]?'var(--atext)':'var(--btntx)'}},o[1]);
            })
          )
        ),

        // FILTERS
        h('div',{className:'card-solid',style:{padding:'8px 10px'}},
          h('div',{style:{display:'flex',gap:5,overflowX:'auto',paddingBottom:2}},
            filters.map(function(fb){
              return h('button',{key:fb[0],onClick:function(){setFilter(fb[0]);},style:{padding:'5px 10px',borderRadius:7,fontSize:11,fontWeight:700,border:'none',cursor:'pointer',whiteSpace:'nowrap',background:filter===fb[0]?'var(--acc)':'var(--btn)',color:filter===fb[0]?'var(--atext)':'var(--btntx)',flexShrink:0}},fb[1]+' ('+fb[2]+')');
            })
          )
        ),

        // ADD GAME
        showAdd?h(AddForm,{onAdd:addG,onClose:function(){setShowAdd(false);}})
          :h('button',{onClick:function(){setShowAdd(true);},style:{width:'100%',padding:'12px 0',borderRadius:12,border:'none',cursor:'pointer',fontWeight:800,fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',gap:6,color:'#fff',background:'linear-gradient(135deg,var(--acc),var(--acc2))',boxShadow:'0 4px 20px rgba(0,0,0,.25)'}},h(Ico,{n:'plus',s:16,col:'#fff'}),' Add New Game'),

        // GAME LIST
        shown.length>0
          ?settings.view==='tiles'
            ?h('div',{className:'tiles-grid'},
                shown.map(function(g){
                  return h(TileCard,{key:g.id,g:g,cover:imgCache[g.id]||null,onClick:function(){setTilePopup(g.id);}});
                })
              )
            :settings.view==='grid'
              ?h('div',{className:'vgrid'},
                  shown.map(function(g){
                    return h(GridCard,{key:g.id,g:g,cover:imgCache[g.id]||null,onSt:upSt,onRt:upRt});
                  })
                )
              :h('div',{className:'vlist'},
                  shown.map(function(g){
                    return h(GameCard,{key:g.id,g:g,cover:imgCache[g.id]||null,exp:expId===g.id,setExp:function(v){setExpId(v?g.id:null);},onSt:upSt,onRt:upRt,onNt:upNt,onDel:delG});
                  })
                )
          :h('div',{className:'card-solid',style:{padding:'40px 20px',textAlign:'center'}},
              h('div',{style:{fontSize:48,marginBottom:12}},'🎮'),
              h('p',{style:{fontWeight:700,fontSize:14,color:'var(--sub)'}},'No games found'),
              h('p',{style:{fontSize:11,color:'var(--muted)',marginTop:4}},q?'Try a different search':filter!=='all'?'No games in this category':'Click Add New Game to get started!')
            ),

        // MOBILE SIDEBARS
        h('div',{className:'side-col-mobile'},h(MobilePanels,{onAdd:addG})),

        h('p',{style:{textAlign:'center',fontSize:10,color:'var(--muted)',padding:'8px 0 4px'}},'Made with ❤️ for '+C.AUTH+"'s Gaming Journey • v"+C.VER)
      ),

      // RIGHT SIDEBAR (desktop only)
      h('div',{className:'right-col sticky-panel'},h(RightSidebar,{onAdd:addG}))
    )
  );
}

ReactDOM.render(h(App,null),document.getElementById('app-root'));

// PWA
(function(){
  var d=null;
  if('serviceWorker'in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('service-worker.js').catch(function(){});});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();d=e;var dis=localStorage.getItem('iDis');if(!dis||(Date.now()-parseInt(dis))/86400000>7)setTimeout(function(){var el=document.getElementById('IP');if(el)el.classList.add('show');},6000);});
  document.getElementById('iBtn').addEventListener('click',function(){if(d){d.prompt();d=null;}var el=document.getElementById('IP');if(el)el.classList.remove('show');});
  document.getElementById('dBtn').addEventListener('click',function(){var el=document.getElementById('IP');if(el)el.classList.remove('show');localStorage.setItem('iDis',Date.now()+'');});
})();
</script>
